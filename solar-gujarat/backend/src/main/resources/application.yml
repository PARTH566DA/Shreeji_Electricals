spring:
  application:
    name: solar-gujarat-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  # 8080/8081 are taken on this machine; backend runs on 8090.
  port: 8090

# CORS allowed origins (React dev server). Override per environment.
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  # Admin auth for /api/leads — HTTP Basic with a BCrypt-hashed password.
  # Default password is "shreeji-admin-2026". In production, override the hash via
  # the APP_ADMIN_PASSWORD_HASH env var (never commit a real one). Generate a hash:
  #   htpasswd -bnBC 10 "" 'your-password' | tr -d '\n' | sed 's/^://'
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password-hash: ${APP_ADMIN_PASSWORD_HASH:$2y$10$Humfo2FFKHf4ZnMAIhq.RuB7FyXPKiXvPHgKI4LNwFLlaKkCYYnY.}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# ---------- DEV profile (H2 in-memory) ----------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:solardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

---
# ---------- PROD profile (PostgreSQL) ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solardb}
    username: ${DB_USERNAME:solar}
    password: ${DB_PASSWORD:solar}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
