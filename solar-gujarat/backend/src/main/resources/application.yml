spring:
  application:
    name: solar-gujarat-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  # 8080/8081 are taken on this machine; backend runs on 8090.
  port: 8090

# CORS allowed origins (React dev server). Override per environment.
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  # MVP admin auth — a hardcoded token guards /api/leads. Harden before prod.
  admin:
    token: shreeji-admin-2026

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# ---------- DEV profile (H2 in-memory) ----------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:solardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

---
# ---------- PROD profile (PostgreSQL) ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solardb}
    username: ${DB_USERNAME:solar}
    password: ${DB_PASSWORD:solar}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
