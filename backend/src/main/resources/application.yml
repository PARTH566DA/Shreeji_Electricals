spring:
  application:
    name: solar-gujarat-backend
  # Load local-only secrets (Gemini key) if present; ignored when the file is absent.
  config:
    import: optional:application-local.yml
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8090}
  # Never let X-Forwarded-* rewrite the request's remote address: clients can send those
  # headers themselves, which would let anyone dodge the per-IP rate limits. Proxy
  # handling is done explicitly in ClientIpResolver (app.trust-forwarded-headers).
  forward-headers-strategy: none

# CORS allowed origins (React dev server). Override per environment.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Google Gemini vision API for bill reading (handwritten Gujarati + unclear photos).
  # Free key: https://aistudio.google.com/apikey
  #   - Local dev: put the key in application-local.yml (git-ignored, auto-loaded above).
  #   - Prod: set the GEMINI_API_KEY env var (the extractor falls back to it).
  # When no key is available, bill analysis falls back to local Tesseract OCR (printed bills only).
  # NOTE: api-key is intentionally NOT set here — a default here would shadow the imported
  # application-local.yml value. gemini-2.5-flash reads handwriting best; gemini-2.0-flash
  # allows more free requests/day.
  gemini:
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  # Bill upload rate limit: one accepted upload per client IP per this many seconds.
  # Each upload costs one Gemini vision call, so this protects the limited daily quota
  # from being drained by a single visitor spamming photos. Set to 0 to disable.
  bill:
    rate-limit:
      window-seconds: ${BILL_RATE_LIMIT_WINDOW_SECONDS:60}
    # Global cap on accepted uploads per UTC day (all clients), so rotating IPs can't drain
    # the Gemini quota. Keep it at or below your Gemini daily quota. 0 disables.
    daily-cap: ${BILL_DAILY_CAP:200}
    # Max bill analyses running at once (OCR / PDF rendering are memory-heavy).
    max-concurrent: ${BILL_MAX_CONCURRENT:2}
  # Only set true when the backend sits behind a reverse proxy you control. The client IP is
  # then read from X-Forwarded-For, counting trusted-proxy-count entries from the RIGHT
  # (entries further left are client-supplied and can be forged).
  trust-forwarded-headers: ${APP_TRUST_FORWARDED_HEADERS:false}
  trusted-proxy-count: ${APP_TRUSTED_PROXY_COUNT:1}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

---
# ---------- DEV profile: Swagger UI at /swagger-ui.html ----------
spring:
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
